[project]
name = "alexandria"
version = "0.1.0"
description = "Self-hosted personal knowledge base shared by a human and their AI agents"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "mcp>=1.9",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "python-frontmatter>=1.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.12",
    "itsdangerous>=2.2",
    "pyyaml>=6.0",
    "markdown-it-py>=3.0",
    "pypdf (>=5.0)",
]

[project.scripts]
alexandria = "alexandria.cli:app"

[tool.poetry]
packages = [{ include = "alexandria", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-asyncio = ">=0.24"
respx = ">=0.21"
ruff = ">=0.7"
mypy = ">=1.13"
types-pyyaml = ">=6.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC"]
# ASYNC109/240: local filesystem calls in async code are deliberate (ADR-0005).
ignore = ["S101", "S603", "S607", "RUF012", "B008", "ASYNC109", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["alexandria"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
